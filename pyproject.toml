[tool.poetry]
name = "Cohort-analysis"
version = "1.0.0"
description = "Analyze advertising campaigns and user behavior using visualization in Power BI"
authors = ["Anastasia Iva <Vatson.1604@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Anastasia-0-Iva/Cohort-analysis.git"
repository = "https://github.com/Anastasia-0-Iva/Cohort-analysis.git"
keywords = ["analysis", "cohort analysis", "marketing", "conversion rate", "visualization", "Power BI", "xlsx", "csv", "data-science", "python", "dashboard"]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
matplotlib = "^3.5.0"
seaborn = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^22.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"